<!DOCTYPE html>
<html lang="de">
<head>
  <!-- Browser Setup -->
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- Browser Titel -->
  <title>Income & Expenses App</title>

  <!-- CSS verbinden -->
  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <!-- Haupt-App -->
  <main class="app">
    <h1>Income & Expenses</h1>

    <!-- ============================= -->
    <!-- SUMMARY -->
    <!-- ============================= -->
    <section class="summary">
      <div>
        <span>Einnahmen</span>
        <strong id="totalIncome">0.00 €</strong>
      </div>

      <div>
        <span>Ausgaben</span>
        <strong id="totalExpenses">0.00 €</strong>
      </div>

      <div class="balance">
        <span>Balance</span>
        <strong id="balance">0.00 €</strong>
      </div>
    </section>

    <!-- ============================= -->
    <!-- KATEGORIEN VERWALTEN -->
    <!-- ============================= -->
    <section class="category-manager-card">
      <h2>Kategorien verwalten</h2>

      <input
        id="newCategoryInput"
        type="text"
        placeholder="Neue Kategorie z.B. Auto, Miete, Gehalt"
      />

      <button id="addCategoryBtn">Kategorie speichern</button>

      <ul id="savedCategoriesList"></ul>
    </section>

    <!-- ============================= -->
    <!-- ZAHLUNGSMITTEL VERWALTEN -->
    <!-- ============================= -->
    <section class="payment-manager-card">
      <h2>Zahlungsmittel verwalten</h2>

      <input
        id="newPaymentInput"
        type="text"
        placeholder="Neues Zahlungsmittel z.B. Bargeld, Kreditkarte, PayPal"
      />

      <button id="addPaymentBtn">Zahlungsmittel speichern</button>

      <ul id="savedPaymentsList"></ul>
    </section>

    <!-- ============================= -->
    <!-- NEUER EINTRAG -->
    <!-- ============================= -->
    <section class="form-card">
      <h2>Neuer Eintrag</h2>

      <input
        id="titleInput"
        type="text"
        placeholder="Name z.B. Gehalt, Miete"
      />

      <input
        id="amountInput"
        type="number"
        step="0.0001"
        placeholder="Betrag"
      />

      <input id="dateInput" type="date" />

      <!-- Kategorie auswählen -->
      <select id="categoryInput">
        <option value="">Kategorie auswählen</option>
      </select>

      <!-- Zahlungsmittel auswählen -->
      <select id="paymentInput">
        <option value="">Zahlungsmittel auswählen</option>
      </select>

      <!-- Einnahme oder Ausgabe -->
      <select id="typeInput">
        <option value="income">Einnahme</option>
        <option value="expense">Ausgabe</option>
      </select>

      <button id="addBtn">Eintrag speichern</button>
    </section>

    <!-- ============================= -->
    <!-- MONATSFILTER -->
    <!-- ============================= -->
    <section class="filter-card">
      <h2>Monat filtern</h2>

      <input id="monthFilter" type="month" />

      <button id="clearFilterBtn">Filter löschen</button>
    </section>

    <!-- ============================= -->
    <!-- KATEGORIE AUSWERTUNG -->
    <!-- ============================= -->
    <section class="category-card">
      <h2>Auswertung nach Kategorie</h2>

      <ul id="categorySummaryList"></ul>
    </section>

    <!-- ============================= -->
    <!-- ZAHLUNGSMITTEL AUSWERTUNG -->
    <!-- ============================= -->
    <section class="payment-card">
      <h2>Auswertung nach Zahlungsmittel</h2>

      <ul id="paymentSummaryList"></ul>
    </section>

    <!-- ============================= -->
    <!-- ALLE EINTRÄGE -->
    <!-- ============================= -->
    <section class="list-card">
      <h2>Alle Einträge</h2>

      <ul id="transactionList"></ul>
    </section>
  </main>

  <!-- JavaScript laden -->
  <script src="script.js"></script>
</body>
</html>
