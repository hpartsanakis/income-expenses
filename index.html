<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Income & Expenses App</title>

  <link rel="stylesheet" href="style.css" />
</head>

<body>
  <div class="app">
    <header class="app-header">
      <h1>Income & Expenses App</h1>
      <p>Verwalte Einnahmen, Ausgaben, Kategorien und Zahlungsmittel.</p>
    </header>

    <!-- SUMMARY CARDS -->
    <section class="summary-grid">
      <div class="summary-card income">
        <h3>Einnahmen</h3>
        <p id="total-income">0.00 €</p>
      </div>

      <div class="summary-card expense">
        <h3>Ausgaben</h3>
        <p id="total-expenses">0.00 €</p>
      </div>

      <div class="summary-card balance">
        <h3>Balance</h3>
        <p id="balance">0.00 €</p>
      </div>
    </section>

    <!-- CATEGORY MANAGEMENT -->
    <section class="card">
      <h2>Kategorien Verwaltung</h2>

      <form id="category-form" class="form-row">
        <input
          type="text"
          id="category-input"
          placeholder="Neue Kategorie eingeben"
          required
        />

        <button type="submit">Kategorie speichern</button>
      </form>

      <ul id="category-list" class="tag-list"></ul>
    </section>

    <!-- PAYMENT METHOD MANAGEMENT -->
    <section class="card">
      <h2>Zahlungsmittel Verwaltung</h2>

      <form id="payment-form" class="form-row">
        <input
          type="text"
          id="payment-input"
          placeholder="z.B. Bar, Karte, PayPal, Überweisung"
          required
        />

        <button type="submit">Zahlungsmittel speichern</button>
      </form>

      <ul id="payment-list" class="tag-list"></ul>
    </section>

    <!-- NEW ENTRY -->
    <section class="card">
      <h2>Neuer Eintrag</h2>

      <form id="entry-form" class="entry-form">
        <input
          type="number"
          id="amount-input"
          placeholder="Betrag"
          step="0.01"
          required
        />

        <select id="type-input" required>
          <option value="income">Einnahme</option>
          <option value="expense">Ausgabe</option>
        </select>

        <select id="category-select" required>
          <option value="">Kategorie auswählen</option>
        </select>

        <select id="payment-select" required>
          <option value="">Zahlungsmittel auswählen</option>
        </select>

        <input type="date" id="date-input" required />

        <button type="submit">Eintrag speichern</button>
      </form>
    </section>

    <!-- FILTER -->
    <section class="card">
      <h2>Auswertung</h2>

      <div class="filter-grid">
        <select id="filter-payment">
          <option value="all">Alle Zahlungsmittel</option>
        </select>

        <select id="filter-type">
          <option value="all">Alle Typen</option>
          <option value="income">Nur Einnahmen</option>
          <option value="expense">Nur Ausgaben</option>
        </select>
      </div>
    </section>

    <!-- ENTRIES -->
    <section class="card">
      <h2>Einträge</h2>

      <ul id="entries-list" class="entries-list"></ul>
    </section>
  </div>

  <script src="script.js"></script>
</body>
</html>
